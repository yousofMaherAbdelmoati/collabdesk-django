[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
addopts = -ra
markers =
    unit: isolated test with no PostgreSQL, Redis, broker, or channel-layer prerequisite
    service: integration test that requires the configured PostgreSQL service
    postgres: requires PostgreSQL semantics; skipped under USE_SQLITE=1
    redis: requires a reachable Redis service; skipped under USE_SQLITE=1
